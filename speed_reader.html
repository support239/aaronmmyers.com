<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" sizes="180x180" href="https://aaronmmyers.com/piggybudget.png?v2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://aaronmmyers.com/piggybudget.png?v2">
  <title>Speed Reader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      color: #222;
    }

    /* Icon Bar directly under Speed Reader header */
    .icon-toolbar {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #007bff;
      background-color: #e7f1ff;
      border: 1px solid #b6d4fe;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .icon-btn:hover {
      background-color: #d0e2ff;
    }

    .icon-btn:active {
      transform: scale(0.97);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      resize: vertical;
    }

    /* Text Playback Area */
    .display-area {
      min-height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px dashed #007bff;
      border-radius: 8px;
      background: #fafafa;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      word-break: break-word;
    }

    #word-display {
      font-weight: bold;
      color: #111;
      transition: font-size 0.1s ease;
    }

    /* Action Control Row */
    .action-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    button {
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
      transition: background-color 0.2s, transform 0.1s;
    }

    /* Center Play / Pause Button */
    .play-pause-btn {
      width: 200px;
      padding: 14px 20px;
      font-size: 1.25rem;
      background-color: #28a745;
    }

    .play-pause-btn:hover {
      background-color: #218838;
    }

    .play-pause-btn.playing {
      background-color: #dc3545;
    }

    .play-pause-btn.playing:hover {
      background-color: #c82333;
    }

    /* Rewind & Fast Forward Buttons */
    .nav-btn {
      width: 100px;
      padding: 14px 10px;
      font-size: 1rem;
      background-color: #6c757d;
    }

    .nav-btn:hover {
      background-color: #5a6268;
    }

    /* Bottom Settings Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-around;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 90px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      text-align: center;
    }

    /* Hidden Camera Input */
    #camera-file-input {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Speed Reader</h1>

    <!-- 1. Toolbar directly under Speed Reader text -->
    <div class="icon-toolbar">
      <!-- Camera Button -->
      <button id="camera-btn" class="icon-btn" title="Take a picture">
        <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
        Camera
      </button>

      <!-- Paste Button -->
      <button id="paste-btn" class="icon-btn" title="Paste clipboard text">
        <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4 0.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
        Paste
      </button>
    </div>

    <!-- Hidden native camera input -->
    <input type="file" id="camera-file-input" accept="image/*" capture="environment">

    <!-- 2. Text Area Input -->
    <div class="input-section">
      <textarea id="text-input" placeholder="Paste or capture text to speed-read..."></textarea>
    </div>

    <!-- 3. Text Playback Display -->
    <div class="display-area">
      <div id="word-display">Ready</div>
    </div>

    <!-- 4. Navigation & Start/Pause Control Row -->
    <div class="action-section">
      <button id="rewind-btn" class="nav-btn" title="Rewind 10 words">&#171; -10</button>
      <button id="toggle-btn" class="play-pause-btn">Start</button>
      <button id="ff-btn" class="nav-btn" title="Fast-forward 10 words">+10 &#187;</button>
    </div>

    <!-- 5. Settings Controls at Bottom -->
    <div class="controls">
      <div class="control-group">
        <label for="wpm-input">Speed (WPM):</label>
        <input type="number" id="wpm-input" value="300" min="50" max="2000" step="25" />
      </div>

      <div class="control-group">
        <label for="font-size-input">Font Size (px):</label>
        <input type="number" id="font-size-input" value="60" min="20" max="150" step="5" />
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('text-input');
    const wpmInput = document.getElementById('wpm-input');
    const fontSizeInput = document.getElementById('font-size-input');
    const toggleBtn = document.getElementById('toggle-btn');
    const rewindBtn = document.getElementById('rewind-btn');
    const ffBtn = document.getElementById('ff-btn');
    const pasteBtn = document.getElementById('paste-btn');
    const cameraBtn = document.getElementById('camera-btn');
    const cameraFileInput = document.getElementById('camera-file-input');
    const wordDisplay = document.getElementById('word-display');

    let words = [];
    let currentIndex = 0;
    let isPlaying = false;
    let timerId = null;

    // Initial setup
    wordDisplay.style.fontSize = `${fontSizeInput.value}px`;

    // Font size listener
    fontSizeInput.addEventListener('input', () => {
      const size = fontSizeInput.value || 40;
      wordDisplay.style.fontSize = `${size}px`;
    });

    // Paste Button Functionality
    pasteBtn.addEventListener('click', async () => {
      try {
        const clipboardText = await navigator.clipboard.readText();
        if (clipboardText) {
          textInput.value = clipboardText;
          currentIndex = 0;
          wordDisplay.textContent = "Ready";
        } else {
          alert("Clipboard is empty.");
        }
      } catch (err) {
        alert("Clipboard access blocked. Please allow browser clipboard permissions.");
      }
    });

    // Camera Button Functionality
    cameraBtn.addEventListener('click', () => {
      cameraFileInput.click();
    });

    cameraFileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // Triggers native device capture UI
        alert("Image captured! (Note: Connect an OCR API like Tesseract.js to convert photos directly into editable text).");
      }
    });

    // Helper to get fresh words array
    function loadWords() {
      const rawText = textInput.value.trim();
      if (!rawText) return false;
      words = rawText.split(/\s+/);
      return true;
    }

    // Toggle Start/Pause
    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        pauseReader();
      } else {
        startReader();
      }
    });

    function startReader() {
      if (!loadWords()) {
        alert("Please enter or paste some text first.");
        return;
      }

      if (currentIndex >= words.length) {
        currentIndex = 0;
      }

      isPlaying = true;
      toggleBtn.textContent = 'Pause';
      toggleBtn.classList.add('playing');

      scheduleNextWord();
    }

    function pauseReader() {
      isPlaying = false;
      clearTimeout(timerId);
      toggleBtn.textContent = 'Start';
      toggleBtn.classList.remove('playing');
    }

    function scheduleNextWord() {
      if (!isPlaying) return;

      if (currentIndex < words.length) {
        wordDisplay.textContent = words[currentIndex];
        currentIndex++;

        const wpm = parseInt(wpmInput.value, 10) || 300;
        const interval = (60 / wpm) * 1000;

        timerId = setTimeout(scheduleNextWord, interval);
      } else {
        wordDisplay.textContent = "Finished!";
        pauseReader();
        currentIndex = 0;
      }
    }

    // Rewind 10 Words
    rewindBtn.addEventListener('click', () => {
      if (!loadWords()) return;
      currentIndex = Math.max(0, currentIndex - 10);
      wordDisplay.textContent = words[currentIndex] || "Ready";
    });

    // Fast Forward 10 Words
    ffBtn.addEventListener('click', () => {
      if (!loadWords()) return;
      currentIndex = Math.min(words.length - 1, currentIndex + 10);
      wordDisplay.textContent = words[currentIndex] || "Ready";
    });

    // Speed update listener
    wpmInput.addEventListener('change', () => {
      if (isPlaying) {
        clearTimeout(timerId);
        scheduleNextWord();
      }
    });
  </script>

</body>
</html>
