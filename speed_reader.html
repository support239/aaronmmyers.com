<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" sizes="180x180" href="https://aaronmmyers.com/piggybudget.png?v2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://aaronmmyers.com/piggybudget.png?v2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Reader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      color: #222;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: bold;
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      resize: vertical;
    }

    /* Text Playback Area */
    .display-area {
      min-height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px dashed #007bff;
      border-radius: 8px;
      background: #fafafa;
      text-align: center;
      padding: 20px;
      overflow: hidden;
      word-break: break-word;
    }

    #word-display {
      font-weight: bold;
      color: #111;
      transition: font-size 0.1s ease;
    }

    /* Action Control Row */
    .action-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    /* Base Button Styles */
    button {
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.96);
    }

    /* Center Play / Pause Button (Half of original width) */
    .play-pause-btn {
      width: 200px;
      padding: 14px 20px;
      font-size: 1.25rem;
      background-color: #28a745;
    }

    .play-pause-btn:hover {
      background-color: #218838;
    }

    .play-pause-btn.playing {
      background-color: #dc3545;
    }

    .play-pause-btn.playing:hover {
      background-color: #c82333;
    }

    /* Rewind & Fast Forward Buttons (1/4 size of original width) */
    .nav-btn {
      width: 100px;
      padding: 14px 10px;
      font-size: 1rem;
      background-color: #6c757d;
    }

    .nav-btn:hover {
      background-color: #5a6268;
    }

    /* Bottom Settings Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-around;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="number"] {
      width: 90px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Speed Reader</h1>

    <!-- 1. Text Area Input -->
    <div class="input-section">
      <label for="text-input">Paste your book or text here:</label>
      <textarea id="text-input" placeholder="Paste the text you want to speed-read here..."></textarea>
    </div>

    <!-- 2. Text Playback Display -->
    <div class="display-area">
      <div id="word-display">Ready</div>
    </div>

    <!-- 3. Navigation & Start/Pause Control Row -->
    <div class="action-section">
      <!-- Rewind 10 Words (Left) -->
      <button id="rewind-btn" class="nav-btn" title="Rewind 10 words">&#171; -10</button>
      
      <!-- Start / Pause Toggle Button (Center) -->
      <button id="toggle-btn" class="play-pause-btn">Start</button>

      <!-- Fast Forward 10 Words (Right) -->
      <button id="ff-btn" class="nav-btn" title="Fast-forward 10 words">+10 &#187;</button>
    </div>

    <!-- 4. Settings Controls at Bottom -->
    <div class="controls">
      <div class="control-group">
        <label for="wpm-input">Speed (WPM):</label>
        <input type="number" id="wpm-input" value="300" min="50" max="2000" step="25" />
      </div>

      <div class="control-group">
        <label for="font-size-input">Font Size (px):</label>
        <input type="number" id="font-size-input" value="60" min="20" max="150" step="5" />
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('text-input');
    const wpmInput = document.getElementById('wpm-input');
    const fontSizeInput = document.getElementById('font-size-input');
    const toggleBtn = document.getElementById('toggle-btn');
    const rewindBtn = document.getElementById('rewind-btn');
    const ffBtn = document.getElementById('ff-btn');
    const wordDisplay = document.getElementById('word-display');

    let words = [];
    let currentIndex = 0;
    let isPlaying = false;
    let timerId = null;

    // Initial setup
    wordDisplay.style.fontSize = `${fontSizeInput.value}px`;

    // Font size listener
    fontSizeInput.addEventListener('input', () => {
      const size = fontSizeInput.value || 40;
      wordDisplay.style.fontSize = `${size}px`;
    });

    // Helper to get fresh words array
    function loadWords() {
      const rawText = textInput.value.trim();
      if (!rawText) return false;
      words = rawText.split(/\s+/);
      return true;
    }

    // Toggle Start/Pause
    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        pauseReader();
      } else {
        startReader();
      }
    });

    function startReader() {
      if (!loadWords()) {
        alert("Please enter or paste some text first.");
        return;
      }

      if (currentIndex >= words.length) {
        currentIndex = 0;
      }

      isPlaying = true;
      toggleBtn.textContent = 'Pause';
      toggleBtn.classList.add('playing');

      scheduleNextWord();
    }

    function pauseReader() {
      isPlaying = false;
      clearTimeout(timerId);
      toggleBtn.textContent = 'Start';
      toggleBtn.classList.remove('playing');
    }

    function scheduleNextWord() {
      if (!isPlaying) return;

      if (currentIndex < words.length) {
        wordDisplay.textContent = words[currentIndex];
        currentIndex++;

        const wpm = parseInt(wpmInput.value, 10) || 300;
        const interval = (60 / wpm) * 1000;

        timerId = setTimeout(scheduleNextWord, interval);
      } else {
        wordDisplay.textContent = "Finished!";
        pauseReader();
        currentIndex = 0;
      }
    }

    // Rewind 10 Words Button
    rewindBtn.addEventListener('click', () => {
      if (!loadWords()) return;
      currentIndex = Math.max(0, currentIndex - 10);
      wordDisplay.textContent = words[currentIndex] || "Ready";
    });

    // Fast Forward 10 Words Button
    ffBtn.addEventListener('click', () => {
      if (!loadWords()) return;
      currentIndex = Math.min(words.length - 1, currentIndex + 10);
      wordDisplay.textContent = words[currentIndex] || "Ready";
    });

    // Speed update listener
    wpmInput.addEventListener('change', () => {
      if (isPlaying) {
        clearTimeout(timerId);
        scheduleNextWord();
      }
    });
  </script>

</body>
</html>
