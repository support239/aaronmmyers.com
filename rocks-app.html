<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocks App</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" sizes="180x180" href="https://aaronmmyers.com/dailyrocks.png?v2">
  <link rel="icon" type="image/png" sizes="32x32" href="https://aaronmmyers.com/dailyrocks.png?v2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 768px;
    }

    /* Header & Controls */
    .header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .select-wrapper label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    select {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #fff;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* Category Navigation */
    .categories-wrapper {
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .categories {
      display: flex;
      gap: 8px;
      min-width: max-content;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .cat-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .add-btn {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px dashed var(--primary);
      border-radius: 30px;
      cursor: pointer;
    }

    /* Container States */
    #goalsContainer {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .loading-state, .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: var(--text-muted);
    }

    /* Collapsible Sections */
    .section {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-title {
      padding: 16px 20px;
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      user-select: none;
    }

    .section-title .chevron {
      transition: transform 0.2s ease;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .section-title.open .chevron {
      transform: rotate(180deg);
    }

    .section-content {
      display: none;
      padding: 12px 20px 20px 20px;
      border-top: 1px solid var(--border);
      background: #fafafa;
    }

    .section-content.open {
      display: block;
    }

    /* Field Group & Inline Edit Area */
    .field-group {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Static view of editable text */
    .inline-display {
      min-height: 48px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
      cursor: pointer;
      white-space: pre-wrap;
      word-break: break-word;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .inline-display:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .inline-display.placeholder {
      color: var(--text-muted);
      font-style: italic;
    }

    /* Hidden input form until clicked */
    .inline-edit-container {
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .inline-edit-container.editing {
      display: flex;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1.5px solid var(--primary);
      border-radius: 8px;
      resize: vertical;
      outline: none;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .field-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button.save-btn {
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button.cancel-btn {
      padding: 8px 14px;
      font-size: 0.875rem;
      font-weight: 500;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>🪨 Rocks App</h1>
      <div class="select-wrapper">
        <label for="quarterSelect">Quarter</label>
        <select id="quarterSelect" onchange="loadGoals()">
          <option value="Q1-2026">Q1 (Jan - Mar 2026)</option>
          <option value="Q2-2026">Q2 (Apr - Jun 2026)</option>
          <option value="Q3-2026">Q3 (Jul - Sep 2026)</option>
          <option value="Q4-2026">Q4 (Oct - Dec 2026)</option>
          <option value="Q1-2027">Q1 (Jan - Mar 2027)</option>
        </select>
      </div>
    </div>

    <div class="categories-wrapper">
      <div class="categories">
        <button class="cat-btn active" onclick="selectCategory('Finance')"><span>💼</span> Finance</button>
        <button class="cat-btn" onclick="selectCategory('Workouts')"><span>🏋️</span> Workouts</button>
        <button class="cat-btn" onclick="selectCategory('Relationships')"><span>❤️</span> Relationships</button>
        <button class="cat-btn" onclick="selectCategory('Mental Health')"><span>🧠</span> Mental Health</button>
        <button class="add-btn" onclick="addNewGoal()">+ Add Field</button>
      </div>
    </div>

    <div id="goalsContainer">
      <div class="loading-state">Loading goals...</div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx8UOGUuJ9M0Acu_Q0_nIjwpQ0zJtQQBMUsrjs2ksrvHrThyXJiguEWrawAsnUo2ap2eg/exec";
    let currentCategory = "Finance";
    let allQuarterData = [];

    function setInitialQuarter() {
      const now = new Date();
      const month = now.getMonth();
      const year = now.getFullYear();
      let q = Math.floor(month / 3) + 1;
      document.getElementById("quarterSelect").value = `Q${q}-${year}`;
    }

    async function loadGoals() {
      const quarter = document.getElementById("quarterSelect").value;
      const container = document.getElementById("goalsContainer");
      container.innerHTML = '<div class="loading-state">Loading goals...</div>';
      
      try {
        const response = await fetch(`${API_URL}?quarter=${quarter}`);
        allQuarterData = await response.json();
        renderCategoryData();
      } catch (err) {
        container.innerHTML = '<div class="empty-state">Unable to load data. Please try again.</div>';
      }
    }

    function selectCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(cat));
      });
      renderCategoryData();
    }

    function renderCategoryData() {
      const filtered = allQuarterData.filter(item => item.category === currentCategory);
      const container = document.getElementById("goalsContainer");
      container.innerHTML = "";

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No goals found for this category and quarter.</div>';
        return;
      }

      const sections = {};
      filtered.forEach(item => {
        if (!sections[item.section]) sections[item.section] = [];
        sections[item.section].push(item);
      });

      for (const sectionName in sections) {
        const secDiv = document.createElement("div");
        secDiv.className = "section";

        const titleDiv = document.createElement("div");
        titleDiv.className = "section-title";
        titleDiv.innerHTML = `<span>${sectionName}</span><span class="chevron">▼</span>`;
        
        const contentDiv = document.createElement("div");
        contentDiv.className = "section-content";

        titleDiv.onclick = () => {
          const isOpen = contentDiv.classList.toggle("open");
          titleDiv.classList.toggle("open", isOpen);
        };

        sections[sectionName].forEach(field => {
          const fieldGroup = document.createElement("div");
          fieldGroup.className = "field-group";
          
          const hasVal = field.value && field.value.trim().length > 0;
          
          fieldGroup.innerHTML = `
            <label>${field.fieldLabel}</label>
            <div id="display-${field.row}" class="inline-display ${hasVal ? '' : 'placeholder'}" onclick="enableEdit(${field.row})">
              ${hasVal ? escapeHtml(field.value) : 'Click to enter details...'}
            </div>
            <div id="edit-container-${field.row}" class="inline-edit-container">
              <textarea id="input-${field.row}">${field.value}</textarea>
              <div class="field-actions">
                <button class="cancel-btn" onclick="cancelEdit(${field.row})">Cancel</button>
                <button class="save-btn" onclick="saveGoal(${field.row}, this)">Save</button>
              </div>
            </div>
          `;
          contentDiv.appendChild(fieldGroup);
        });

        secDiv.appendChild(titleDiv);
        secDiv.appendChild(contentDiv);
        container.appendChild(secDiv);
      }
    }

    function enableEdit(rowId) {
      document.getElementById(`display-${rowId}`).style.display = "none";
      const editContainer = document.getElementById(`edit-container-${rowId}`);
      editContainer.classList.add("editing");
      
      const textarea = document.getElementById(`input-${rowId}`);
      textarea.focus();
    }

    function cancelEdit(rowId) {
      document.getElementById(`edit-container-${rowId}`).classList.remove("editing");
      document.getElementById(`display-${rowId}`).style.display = "block";
    }

    async function saveGoal(rowId, buttonEl) {
      const textarea = document.getElementById(`input-${rowId}`);
      const val = textarea.value;
      const payload = { action: "update", row: rowId, value: val };

      buttonEl.disabled = true;
      buttonEl.innerText = "Saving...";

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        // Update local state and UI elements
        const item = allQuarterData.find(d => d.row === rowId);
        if (item) item.value = val;

        const displayEl = document.getElementById(`display-${rowId}`);
        if (val.trim().length > 0) {
          displayEl.innerText = val;
          displayEl.classList.remove("placeholder");
        } else {
          displayEl.innerText = "Click to enter details...";
          displayEl.classList.add("placeholder");
        }

        cancelEdit(rowId);
        buttonEl.innerText = "Save";
        buttonEl.disabled = false;
      } catch (e) {
        alert("Failed to save. Please try again.");
        buttonEl.innerText = "Save";
        buttonEl.disabled = false;
      }
    }

    async function addNewGoal() {
      const section = prompt("Enter section name (e.g., Strategic Actions):");
      if (!section) return;
      const label = prompt("Enter field label (e.g., Action Item 1):");
      if (!label) return;

      const quarter = document.getElementById("quarterSelect").value;
      const payload = {
        action: "add",
        quarter: quarter,
        category: currentCategory,
        section: section,
        fieldLabel: label,
        value: ""
      };

      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      loadGoals();
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    setInitialQuarter();
    loadGoals();
  </script>
</body>
</html>
