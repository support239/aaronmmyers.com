<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parenting & Communication Workshop</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #d69e2e;
            --bg-color: #f7fafc;
            --text-color: #2d3748;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 25px;
            margin-bottom: 30px;
        }

        .salutation {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.75rem;
            line-height: 1.2;
            margin-top: 15px;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .factors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .factor-card {
            background-color: #edf2f7;
            padding: 15px;
            text-align: center;
            border-radius: 6px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .testimonials {
            background-color: #f7fafc;
            border-left: 4px solid var(--secondary-color);
            padding: 20px;
            margin: 30px 0;
            font-style: italic;
        }

        .testimonial-item {
            margin-bottom: 15px;
        }

        .testimonial-item:last-child {
            margin-bottom: 0;
        }

        .author {
            font-style: normal;
            font-weight: bold;
            color: var(--primary-color);
            display: block;
            margin-top: 5px;
        }
